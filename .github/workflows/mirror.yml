name: mirror

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose -- GitHub delays cron jobs that
    # pile up on round times.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Sync only this mirror (blank = all of them)'
        required: false
        default: ''
      reinit:
        description: 'Discard the target history and re-seed from one commit'
        type: boolean
        default: false

# Nothing here writes to this repo; the mirrors are pushed with deploy keys.
permissions:
  contents: read

# Two runs pushing the same snapshot branch would race.
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if ! command -v yq >/dev/null; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi

          yq -o=json '.mirrors' mirrors.yml >all.json
          if [ -n "$ONLY" ]; then
            matrix="$(jq -c --arg only "$ONLY" '[.[] | select(.name == $only)]' all.json)"
          else
            matrix="$(jq -c '.' all.json)"
          fi

          count="$(jq 'length' <<<"$matrix")"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "planning $count mirror(s): $(jq -r '[.[].name] | join(", ")' <<<"$matrix")"

          if [ "$count" = "0" ]; then
            echo "::warning::no mirror matched '$ONLY'"
          fi

  mirror:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    # The first import of a large project is the slow one; later syncs are
    # minutes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Each mirror wants several GB of runner disk, so keep them apart.
      max-parallel: 2
      matrix:
        mirror: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.mirror.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Sync ${{ matrix.mirror.name }}
        env:
          NAME: ${{ matrix.mirror.name }}
          UPSTREAM: ${{ matrix.mirror.upstream }}
          UPSTREAM_REF: ${{ matrix.mirror.upstream_ref }}
          TARGET: ${{ matrix.mirror.target }}
          TARGET_BRANCH: ${{ matrix.mirror.target_branch }}
          STRIP_JSON: ${{ toJson(matrix.mirror.strip) }}
          REINIT: ${{ inputs.reinit && '1' || '0' }}
          DEPLOY_KEY: ${{ secrets[matrix.mirror.deploy_key_secret] }}
        run: |
          df -h /
          scripts/mirror.sh

  # GitHub disables a cron workflow after 60 days of repository inactivity, and
  # workflow runs do not count as activity. The commits here go to the mirror
  # repos, not to this one, so without a nudge the schedule would switch itself
  # off after two quiet months.
  keepalive:
    needs: mirror
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Reset the inactivity timer if the repo has gone quiet
        run: |
          set -euo pipefail
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit here is $age day(s) old"
          [ "$age" -ge 45 ] || exit 0

          date -u +'%Y-%m-%dT%H:%M:%SZ' >.keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `.keepalive` is created on the first quiet-period reset, so it is
          # untracked at that point. `git commit -a` skips untracked files.
          git add -- .keepalive
          git commit -qm "Keep the daily schedule enabled"
          git push
          echo "::notice::committed a keepalive to stop GitHub disabling the schedule"
